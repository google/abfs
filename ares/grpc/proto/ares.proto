syntax = "proto3";

package ares;

option go_package = "github.com/google/abfs/ares/grpc/proto";

service ARES {
  // we could move this to return a stream of google.longrunning.Operation if the extra communication is needed by clients
  rpc Execute (ExecuteRequest) returns (ExecuteResponse) {}
}

message ExecuteRequest {
  bytes evalRequest = 1;
  // patches is any extra patches that should be applied to the tree before executing the request
  repeated bytes patches = 2;
  bool storeMapResult = 3;
  bool prefetchInputs = 4;
}

message ExecuteResponse {
  bytes evalResponse = 1;
}
